plugins {
    id 'groovy'
}

group = 'io.github.thetaoofcoding'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.apache.groovy:groovy:6.0.0")
    implementation("org.apache.groovy:groovy-http-builder:6.0.0")
    implementation('org.apache.groovy:groovy-json:6.0.0')

    implementation("org.jsoup:jsoup:1.23.2")

    implementation("org.apache.logging.log4j:log4j-api:2.26.1")
    implementation("org.apache.logging.log4j:log4j-core:2.26.1")
    implementation("org.apache.logging.log4j:log4j-slf4j-impl:2.26.1")


    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
    testImplementation("org.junit.platform:junit-platform-launcher:6.1.3")
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}